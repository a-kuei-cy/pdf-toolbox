<style>
:root{--bg:#fff8ef;--card:#fff;--ink:#3d332e;--muted:#81736b;--orange:#ff7a3d;--pink:#ff7192;--purple:#8271ef;--line:#eddfd4;--ok:#258b64;--shadow:0 12px 32px rgba(92,65,46,.10)}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink);background:linear-gradient(#fff5e8,#fffaf6 52%,#eef7e9);min-height:100vh}.top{position:sticky;top:0;z-index:30;background:#fffaf3e8;backdrop-filter:blur(10px);border-bottom:1px solid #eaded4}.topin{max-width:1000px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:10px;font-weight:900}.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#ffb06c,#ff758f);font-size:22px}.offline{margin-left:auto;font-size:12px;padding:7px 10px;border-radius:999px;background:#e8f7f0;color:var(--ok)}main{max-width:1000px;margin:auto;padding:18px 14px 50px}.hero,.card{background:#fffffff2;border:1px solid #ffffffcc;border-radius:24px;box-shadow:var(--shadow)}.hero{padding:26px;background:linear-gradient(135deg,#fffdf8,#ffeede);overflow:hidden;position:relative;isolation:isolate}.hero:before{content:"";position:absolute;width:155px;height:155px;border-radius:50%;right:-58px;bottom:-72px;background:linear-gradient(135deg,#ffd798,#ffb6c2);opacity:.72;z-index:-1}.hero:after{content:"";position:absolute;width:88px;height:88px;border-radius:26px;right:22px;top:18px;background:linear-gradient(135deg,#93d7ff,#8c7df2);opacity:.16;transform:rotate(18deg);z-index:-1}h1{font-size:clamp(32px,7vw,58px);line-height:1.04;margin:8px 0 12px;position:relative;z-index:1;max-width:760px;padding-right:88px}h1 span{color:var(--orange)}.lead{color:var(--muted);line-height:1.8;max-width:690px;position:relative;z-index:1}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1}.chip{background:#fff;border:1px solid #f0dfd1;border-radius:999px;padding:7px 10px;font-size:13px}.card{padding:22px;margin-top:18px}.title{font-size:21px;margin:0 0 12px;display:flex;gap:10px;align-items:center}.num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--orange),var(--pink))}.hint{font-size:13px;color:var(--muted);line-height:1.65}.drop{border:2px dashed #edc5a6;border-radius:18px;padding:25px 16px;text-align:center;background:#fffaf5;cursor:pointer;margin-top:12px}.drop.drag{border-color:var(--orange);background:#fff0e4}.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.tool{padding:14px;border:2px solid transparent;background:#fff9f5;border-radius:16px;cursor:pointer;text-align:left}.tool.active{border-color:var(--orange);background:#fff2e9}.tool b{display:block;margin-bottom:4px}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #dacbc0;border-radius:11px;background:#fff;font:inherit}textarea{min-height:82px;resize:vertical}.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:12px;margin-top:14px}.page{background:#faf7f4;border:2px solid transparent;border-radius:15px;padding:8px;cursor:grab;position:relative}.page.dragging{opacity:.45}.page.over{border-color:var(--purple)}.thumb{aspect-ratio:.707;background:#eee;border-radius:8px;display:grid;place-items:center;overflow:hidden}.thumb canvas{width:100%;height:100%;object-fit:contain}.pagebar{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-top:7px;font-size:12px}.mini{padding:5px 7px;border:0;border-radius:8px;background:#eee8ff;color:#6252bd;font-weight:800;cursor:pointer}.remove{background:#ffe6e9;color:#bd4256}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}button.main{border:0;border-radius:13px;padding:13px 18px;font:inherit;font-weight:900;cursor:pointer}.primary{background:linear-gradient(90deg,#ffaf58,#ff7392);color:#fff}.secondary{background:#eee9ff;color:#6555c4}button:disabled{opacity:.45;cursor:not-allowed}.progress{height:10px;background:#eee6e0;border-radius:999px;overflow:hidden;margin-top:12px;display:none}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--pink))}.status{margin-top:10px;padding:10px 12px;border-radius:11px;background:#fff5df;color:#845a20;font-size:13px;white-space:pre-wrap}.split-list{display:grid;gap:7px;margin-top:10px}.split-item{padding:9px 11px;border-radius:10px;background:#faf7f4;font-size:13px}.results{display:none}.results.show{display:block}.result-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.result-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff}.result-row input[type=checkbox]{width:18px;height:18px}.result-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.result-btn{border:0;border-radius:9px;padding:7px 9px;font-weight:800;cursor:pointer}.preview-btn{background:#eaf4ff;color:#28669b}.download-btn{background:#eee9ff;color:#6555c4}@media(max-width:560px){.card,.hero{border-radius:19px}.card{padding:17px}.pages{grid-template-columns:repeat(2,1fr)}h1{padding-right:0}.hero:after{right:12px;top:auto;bottom:20px;width:58px;height:58px;opacity:.10}.hero:before{right:-76px;bottom:-85px}}

</head><body>
<header class="top"><div class="topin"><div class="logo">📄</div>PDF 全能工具箱 <span id="offlineBadge" class="offline">本機處理</span></div></header>
<main>
<section class="hero"><h1>整理、編輯與輸出<br><span>您的 PDF 文件</span></h1><div class="lead">預覽縮圖、拖曳排序、合併、旋轉、拆分、壓縮、加密與浮水印。檔案只在您的瀏覽器中處理，不會上傳。</div><div class="chips"><span class="chip">🖼️ 預覽縮圖</span><span class="chip">↕️ 拖曳排序</span><span class="chip">🔗 合併 PDF</span><span class="chip">📦 拆分 ZIP</span><span class="chip">🔒 本機處理</span></div></section>
<section class="card"><h2 class="title"><span class="num">1</span>加入 PDF</h2><div class="hint">可一次加入多個 PDF；合併模式會依縮圖順序輸出。</div><input id="fileInput" type="file" accept="application/pdf" multiple hidden><div id="drop" class="drop"><div style="font-size:34px">⬆️</div><b>點選或拖曳 PDF 檔案</b><div class="hint">支援多檔案；資料不上傳</div></div></section>
<section class="card"><h2 class="title"><span class="num">2</span>選擇工具</h2><div class="tools" id="tools"><button class="tool active" data-tool="merge"><b>🔗 合併 PDF</b><small>依縮圖順序合併</small></button><button class="tool" data-tool="split"><b>✂️ 拆分 PDF</b><small>拆分後自動 ZIP</small></button><button class="tool" data-tool="rotate"><b>🔄 PDF 旋轉</b><small>旋轉選取或全部頁</small></button><button class="tool" data-tool="compress"><b>🗜️ 壓縮 PDF</b><small>轉為壓縮影像 PDF</small></button><button class="tool" data-tool="encrypt"><b>🔐 加密 PDF</b><small>設定開啟密碼</small></button><button class="tool" data-tool="watermark"><b>💧 浮水印</b><small>文字浮水印</small></button></div>
<div id="options" class="controls"></div><div class="actions"><button id="runBtn" class="main primary" disabled>開始處理</button><button id="clearBtn" class="main secondary">清除全部</button></div><div class="progress" id="progress"><i id="bar"></i></div><div id="status" class="status">尚未加入 PDF。</div></section>
<section class="card"><h2 class="title"><span class="num">3</span>PDF 預覽與排序</h2><div class="hint">拖曳縮圖調整順序；可逐頁旋轉或移除。頁面很多時，縮圖產生需要一些時間。</div><div id="pages" class="pages"></div><div id="splitPreview" class="split-list"></div></section><section id="resultsCard" class="card results"><h2 class="title"><span class="num">4</span>拆分結果</h2><div class="hint">可逐一下載、預覽、下載勾選項目，或打包成 ZIP。</div><div class="result-toolbar"><button id="selectAllBtn" class="main secondary">全選</button><button id="downloadSelectedBtn" class="main secondary">下載勾選</button><button id="downloadZipBtn" class="main primary">下載 ZIP</button></div><div id="resultsList" class="split-list"></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfkit@0.15.0/js/pdfkit.standalone.js"></script>
<script src="https://cdn.jsdelivr.net/npm/blob-stream@0.1.3/blob-stream.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
const $=s=>document.querySelector(s), pagesEl=$('#pages'), statusEl=$('#status'), runBtn=$('#runBtn');
let items=[], tool='merge', dragIndex=null, splitResults=[];
const optionHTML={merge:'<div class="field"><label>輸出檔名</label><input id="outName" value="merged.pdf"></div>',split:'<div class="field"><label>拆分方式</label><select id="splitMode"><option value="each">每頁一份</option><option value="every">每 N 頁一份</option><option value="range">自訂範圍</option></select></div><div class="field" id="splitValueWrap"><label>每幾頁</label><input id="splitValue" type="number" min="1" value="2"></div>',rotate:'<div class="field"><label>旋轉範圍</label><select id="rotateScope"><option value="all">全部頁面</option><option value="selected">只旋轉已個別調整的頁面</option></select></div><div class="field"><label>旋轉角度</label><select id="rotateDeg"><option>90</option><option>180</option><option>270</option></select></div>',compress:'<div class="field"><label>壓縮品質</label><select id="quality"><option value="0.82">高品質</option><option value="0.65" selected>平衡</option><option value="0.45">小檔案</option></select></div><div class="field"><label>解析度</label><select id="scale"><option value="1.5">清晰</option><option value="1.2" selected>標準</option><option value="0.9">更小</option></select></div>',encrypt:'<div class="field"><label>開啟密碼</label><input id="password" type="password" placeholder="至少 4 個字元"></div><div class="field"><label>輸出品質</label><select id="encQuality"><option value="0.9">高品質</option><option value="0.75" selected>平衡</option></select></div>',watermark:'<div class="field"><label>浮水印文字</label><input id="wmText" value="CONFIDENTIAL"></div><div class="field"><label>透明度</label><input id="wmOpacity" type="number" min="0.05" max="1" step="0.05" value="0.25"></div><div class="field"><label>字體大小</label><input id="wmSize" type="number" min="12" max="150" value="48"></div>'};
function setOptions(){ $('#options').innerHTML=optionHTML[tool]; runBtn.textContent={merge:'🔗 合併並下載',split:'✂️ 產生拆分檔案',rotate:'🔄 旋轉並下載',compress:'🗜️ 壓縮並下載',encrypt:'🔐 加密並下載',watermark:'💧 加入浮水印並下載'}[tool]; if(tool==='split') $('#splitMode').onchange=updateSplitOption; }
function updateSplitOption(){const m=$('#splitMode').value,w=$('#splitValueWrap');w.innerHTML=m==='range'?'<label>頁碼範圍（每行一份）</label><textarea id="splitValue" placeholder="1-3\n4-6\n7,9,11"></textarea>':'<label>每幾頁</label><input id="splitValue" type="number" min="1" value="2">';renderSplitPreview()}
setOptions();
$('#tools').onclick=e=>{const b=e.target.closest('.tool');if(!b)return;document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));b.classList.add('active');tool=b.dataset.tool;setOptions();renderSplitPreview()};
const drop=$('#drop'),fi=$('#fileInput');drop.onclick=()=>fi.click();fi.onchange=()=>addFiles([...fi.files]);['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>addFiles([...e.dataTransfer.files]));
async function addFiles(files){files=files.filter(f=>f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf'));if(!files.length)return alert('請選擇 PDF 檔案。');showProgress(true);try{for(const file of files){const bytes=new Uint8Array(await file.arrayBuffer());const lib=await PDFLib.PDFDocument.load(bytes,{ignoreEncryption:false});const js=await pdfjsLib.getDocument({data:bytes.slice()}).promise;for(let p=1;p<=lib.getPageCount();p++){items.push({fileName:file.name,bytes,page:p,rotation:0,id:crypto.randomUUID(),pdfjs:js});setProgress(items.length/(items.length+Math.max(0,lib.getPageCount()-p))*100);}}await renderPages();}catch(e){console.error(e);alert('部分 PDF 無法讀取，可能已有密碼、損壞或格式不支援。')}finally{showProgress(false);updateStatus()}}
async function renderPages(){pagesEl.innerHTML='';for(let i=0;i<items.length;i++){const it=items[i],card=document.createElement('div');card.className='page';card.draggable=true;card.dataset.index=i;card.innerHTML='<div class="thumb"><span>載入中…</span></div><div class="pagebar"><span>'+(i+1)+'. '+escapeHtml(it.fileName)+' / '+it.page+'</span><span><button class="mini rot">↻</button><button class="mini remove">×</button></span></div>';pagesEl.appendChild(card);card.ondragstart=()=>{dragIndex=i;card.classList.add('dragging')};card.ondragend=()=>{dragIndex=null;card.classList.remove('dragging');document.querySelectorAll('.page').forEach(x=>x.classList.remove('over'))};card.ondragover=e=>{e.preventDefault();card.classList.add('over')};card.ondragleave=()=>card.classList.remove('over');card.ondrop=e=>{e.preventDefault();if(dragIndex===null||dragIndex===i)return;const [m]=items.splice(dragIndex,1);items.splice(i,0,m);renderPages();updateStatus()};card.querySelector('.rot').onclick=()=>{it.rotation=(it.rotation+90)%360;renderPages()};card.querySelector('.remove').onclick=()=>{items.splice(i,1);renderPages();updateStatus()};renderThumb(it,card.querySelector('.thumb'));}}
async function renderThumb(it,box){try{const page=await it.pdfjs.getPage(it.page),v=page.getViewport({scale:.45,rotation:it.rotation}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;await page.render({canvasContext:c.getContext('2d'),viewport:v}).promise;box.innerHTML='';box.appendChild(c)}catch{box.textContent='預覽失敗'}}
function updateStatus(){runBtn.disabled=!items.length;const files=new Set(items.map(x=>x.fileName)).size;statusEl.textContent=items.length?`已載入 ${files} 個檔案，共 ${items.length} 頁。所有處理均在本機瀏覽器完成。`:'尚未加入 PDF。';renderSplitPreview()}
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function showProgress(on){$('#progress').style.display=on?'block':'none';if(!on)setTimeout(()=>setProgress(0),300)}function setProgress(n){$('#bar').style.width=Math.max(0,Math.min(100,n))+'%'}function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
async function buildPdfLib(selected=items){const out=await PDFLib.PDFDocument.create();for(let i=0;i<selected.length;i++){const it=selected[i],src=await PDFLib.PDFDocument.load(it.bytes);const [p]=await out.copyPages(src,[it.page-1]);p.setRotation(PDFLib.degrees((p.getRotation().angle+it.rotation)%360));out.addPage(p);setProgress((i+1)/selected.length*90)}return out}
function parseRanges(text,total){const groups=text.split(/\n+/).map(x=>x.trim()).filter(Boolean);if(!groups.length)throw Error('請輸入頁碼範圍。');return groups.map(g=>{let a=[];for(const part of g.split(',').map(x=>x.trim())){if(/^\d+$/.test(part))a.push(+part);else if(/^\d+\s*-\s*\d+$/.test(part)){let [s,e]=part.split('-').map(Number);if(s>e)[s,e]=[e,s];for(let n=s;n<=e;n++)a.push(n)}else throw Error('頁碼格式錯誤：'+part)}a=[...new Set(a)];if(a.some(n=>n<1||n>total))throw Error(`頁碼需介於 1 到 ${total}`);return a})}
function splitGroups(){const total=items.length,m=$('#splitMode')?.value||'each';if(m==='each')return Array.from({length:total},(_,i)=>[i+1]);if(m==='every'){const n=+$('#splitValue').value;if(!Number.isInteger(n)||n<1)throw Error('N 必須為正整數。');const g=[];for(let i=1;i<=total;i+=n)g.push(Array.from({length:Math.min(n,total-i+1)},(_,k)=>i+k));return g}return parseRanges($('#splitValue').value,total)}
function renderSplitPreview(){const el=$('#splitPreview');if(tool!=='split'||!items.length){el.innerHTML='';return}try{const g=splitGroups();el.innerHTML=g.map((x,i)=>`<div class="split-item">第 ${i+1} 份：頁 ${x.join(', ')}</div>`).join('')}catch{el.innerHTML=''}}
async function rasterPages(quality,scale,password){const doc=new PDFDocument({autoFirstPage:false,compress:true,userPassword:password||undefined,ownerPassword:password||undefined,permissions:password?{printing:'lowResolution',modifying:false,copying:false,annotating:false,fillingForms:false,contentAccessibility:true,documentAssembly:false}:undefined});const stream=doc.pipe(blobStream());for(let i=0;i<items.length;i++){const it=items[i],page=await it.pdfjs.getPage(it.page),vp=page.getViewport({scale,rotation:it.rotation}),c=document.createElement('canvas');c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;const data=c.toDataURL('image/jpeg',quality);doc.addPage({size:[vp.width,vp.height],margin:0});doc.image(data,0,0,{width:vp.width,height:vp.height});setProgress((i+1)/items.length*95)}doc.end();return await new Promise((res,rej)=>{stream.on('finish',()=>res(stream.toBlob('application/pdf')));stream.on('error',rej)})}
runBtn.onclick=async()=>{if(!items.length)return;runBtn.disabled=true;showProgress(true);try{if(tool==='merge'||tool==='rotate'){if(tool==='rotate'&&$('#rotateScope').value==='all'){const d=+$('#rotateDeg').value;items.forEach(x=>x.rotation=(x.rotation+d)%360)}const out=await buildPdfLib();download(new Blob([await out.save({useObjectStreams:true})],{type:'application/pdf'}),tool==='merge'?($('#outName').value||'merged.pdf'):'rotated.pdf')}else if(tool==='watermark'){const out=await buildPdfLib(),txt=$('#wmText').value||'WATERMARK',op=+$('#wmOpacity').value,size=+$('#wmSize').value,font=await out.embedFont(PDFLib.StandardFonts.HelveticaBold);out.getPages().forEach(p=>{const {width,height}=p.getSize();p.drawText(txt,{x:width*.12,y:height*.47,size:Math.min(size,width/Math.max(5,txt.length)*1.4),font,opacity:op,rotate:PDFLib.degrees(35),color:PDFLib.rgb(.75,.18,.18)})});download(new Blob([await out.save({useObjectStreams:true})],{type:'application/pdf'}),'watermarked.pdf')}else if(tool==='split'){const groups=splitGroups();splitResults=[];for(let i=0;i<groups.length;i++){const sel=groups[i].map(n=>items[n-1]),out=await buildPdfLib(sel),bytes=await out.save({useObjectStreams:true}),name=`split_${String(i+1).padStart(2,'0')}_pages_${groups[i].join('-')}.pdf`;splitResults.push({name,blob:new Blob([bytes],{type:'application/pdf'}),pages:groups[i],selected:true});setProgress((i+1)/groups.length*100)}renderSplitResults();statusEl.textContent=`拆分完成，共產生 ${splitResults.length} 個 PDF。可逐一下載或下載 ZIP。`}else if(tool==='compress'){const blob=await rasterPages(+$ ('#quality').value,+$('#scale').value);download(blob,'compressed.pdf')}else if(tool==='encrypt'){const pw=$('#password').value;if(pw.length<4)throw Error('密碼至少需要 4 個字元。');const blob=await rasterPages(+$ ('#encQuality').value,1.35,pw);download(blob,'encrypted.pdf')}setProgress(100);statusEl.textContent='處理完成，下載已開始。'}catch(e){console.error(e);alert('處理失敗：'+e.message)}finally{runBtn.disabled=false;setTimeout(()=>showProgress(false),700)}};
$('#clearBtn').onclick=()=>{items=[];splitResults=[];pagesEl.innerHTML='';fi.value='';$('#resultsCard').classList.remove('show');$('#resultsList').innerHTML='';updateStatus()};document.addEventListener('input',e=>{if(e.target.closest('#options'))renderSplitPreview()});

function renderSplitResults(){
  const card=$('#resultsCard'),list=$('#resultsList');
  if(!splitResults.length){card.classList.remove('show');list.innerHTML='';return}
  card.classList.add('show');
  list.innerHTML=splitResults.map((r,i)=>`<div class="result-row"><input class="result-check" type="checkbox" data-i="${i}" ${r.selected?'checked':''}><div class="result-name" title="${escapeHtml(r.name)}"><b>${escapeHtml(r.name)}</b><div class="hint">頁 ${r.pages.join(', ')}</div></div><button class="result-btn preview-btn" data-preview="${i}">預覽</button><button class="result-btn download-btn" data-download="${i}">下載</button></div>`).join('');
}
$('#resultsList').onclick=e=>{const p=e.target.dataset.preview,d=e.target.dataset.download;if(p!==undefined){const u=URL.createObjectURL(splitResults[+p].blob);window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),60000)}if(d!==undefined)download(splitResults[+d].blob,splitResults[+d].name)};
$('#resultsList').onchange=e=>{if(e.target.classList.contains('result-check'))splitResults[+e.target.dataset.i].selected=e.target.checked};
$('#selectAllBtn').onclick=()=>{const all=splitResults.every(r=>r.selected);splitResults.forEach(r=>r.selected=!all);renderSplitResults()};
$('#downloadSelectedBtn').onclick=async()=>{const chosen=splitResults.filter(r=>r.selected);if(!chosen.length)return alert('請先勾選要下載的 PDF。');for(const r of chosen){download(r.blob,r.name);await new Promise(res=>setTimeout(res,250))}};
$('#downloadZipBtn').onclick=async()=>{if(!splitResults.length)return;showProgress(true);const zip=new JSZip();splitResults.forEach(r=>zip.file(r.name,r.blob));const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}},m=>setProgress(m.percent));download(blob,'pdf_split_results.zip');setTimeout(()=>showProgress(false),500)};

if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').then(()=>$('#offlineBadge').textContent='可離線使用').catch(()=>{});if(!navigator.onLine)$('#offlineBadge').textContent='離線模式';window.addEventListener('offline',()=>$('#offlineBadge').textContent='離線模式');window.addEventListener('online',()=>$('#offlineBadge').textContent='本機處理');
</script></body></html>
